  </main>
  <footer>
    <div class="scene">
      <div class="ground" aria-hidden="true"><div class="ground-surface"></div></div>
      <div class="greenery" aria-hidden="true">
        <span class="plant p1">{{ <grass /> }}</span>
        <span class="plant p2">{{ <sprout /> }}</span>
        <span class="plant p3">{{ <cabbage /> }}</span>
        <span class="plant p4">{{ <grass /> }}</span>
        <span class="plant p5">{{ <cabbage /> }}</span>
        <span class="plant p6">{{ <grass /> }}</span>
        <span class="plant p7">{{ <sprout /> }}</span>
        <span class="plant p8">{{ <grass /> }}</span>
      </div>
      <div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="pond" aria-hidden="true">
        <div class="pond-bed"></div>
        <svg class="pond-plants" viewBox="0 0 240 90" preserveAspectRatio="none" focusable="false">
          <g class="pond-stones">
            <path d="M34 75h18v8H34zM57 81h12v6H57zM103 79h22v8h-22zM166 77h18v8h-18zM188 72h14v7h-14z" />
          </g>
          <g class="pond-stems">
            <path d="M54 80V40h3v40zM50 67H39v-4h11zM43 63h-4V52h4zM57 56h11v-4H57zM64 52h4V42h-4zM118 85V48h3v37zM110 71h8v-4h-8zM107 59h3v12h-3zM121 63h10v-4h-10zM128 50h3v13h-3zM178 80V35h3v45zM167 62h11v-4h-11zM164 46h3v16h-3zM181 51h10v-4h-10zM188 37h3v14h-3z" />
          </g>
          <g class="pond-leaves">
            <path d="M47 46h8v8h-8zM62 36h8v8h-8zM101 54h8v8h-8zM125 44h8v8h-8zM158 41h8v8h-8zM186 31h8v8h-8z" />
          </g>
        </svg>
        <div class="pond-water"></div>
        <div class="pond-ice"></div>
      </div>
      <button class="hen hen-flock hf1 hen-white" type="button" aria-label="A hen. Click her.">
        <span class="hen-up">{{ <hen /> }}</span>
        <span class="hen-down">{{ <hen_peck /> }}</span>
        <span class="egg-pop">{{ <egg /> }}</span>
      </button>
      <button class="hen hen-flock hf2 hen-buff" type="button" aria-label="A hen. Click her.">
        <span class="hen-up">{{ <hen /> }}</span>
        <span class="hen-down">{{ <hen_peck /> }}</span>
        <span class="egg-pop">{{ <egg /> }}</span>
      </button>
      <button class="hen hen-flock hf3 hen-black" type="button" aria-label="A hen. Click her.">
        <span class="hen-up">{{ <hen /> }}</span>
        <span class="hen-down">{{ <hen_peck /> }}</span>
        <span class="egg-pop">{{ <egg /> }}</span>
      </button>
      <span class="coop" aria-hidden="true">
        {{ <coop /> }}
        <span class="zzz night-only">z z z</span>
      </span>
      {% for duck in [1, 2, 3] %}
      <span class="runner rd{{ duck }} {% if duck == 1 %}dk-white{% elif duck == 2 %}dk-fawn{% else %}dk-dark{% endif %}" aria-hidden="true">
        <span class="rd-move">
          <i class="rd-splash"></i>
          <span class="rd-face">
            <span class="rd-up">{{ <runner_duck /> }}</span>
            <span class="rd-nibble">{{ <runner_duck_nibble /> }}</span>
            <span class="rd-swim">{{ <duck /> }}</span>
            <span class="rd-down">{{ <runner_duck_tipped /> }}</span>
          </span>
        </span>
      </span>
      {% endfor %}
    </div>
    <div class="colophon">
      <p>&copy; {{ now() | date(format='%Y') }} {{ config.author }} &middot;
        <a href="{{ config.extra.github_url }}">github</a> &middot;
        grown with <a href="https://www.getzola.org">Zola</a>
        &middot; <span id="egg-count"></span></p>
    </div>
  </footer>
  <script type="module" src="{{ get_url(path='farmyard.js', cachebust=true) }}" data-farmyard-model="{{ get_url(path='farmyard-model.js', cachebust=true) }}"></script>
  <script type="module" src="{{ get_url(path='side-plants.js', cachebust=true) }}"></script>
  <script>
    (function () {
      var root = document.documentElement;
      // season picker: pick a season, or click the active one for auto
      var pickers = document.querySelectorAll('.season-picker .sp');
      function autoSeason() {
        var mm = (new Date()).getMonth() + 1;
        return (mm >= 3 && mm <= 5) ? 'spring' : (mm >= 6 && mm <= 8) ? 'summer' : (mm >= 9 && mm <= 11) ? 'autumn' : 'winter';
      }
      function seasonBtnState() {
        Array.prototype.forEach.call(pickers, function (b) {
          b.setAttribute('aria-pressed', b.dataset.set === root.dataset.season ? 'true' : 'false');
        });
      }
      Array.prototype.forEach.call(pickers, function (b) {
        b.addEventListener('click', function () {
          if (b.dataset.set === root.dataset.season) {
            localStorage.removeItem('season');
            root.dataset.season = autoSeason();
          } else {
            localStorage.setItem('season', b.dataset.set);
            root.dataset.season = b.dataset.set;
          }
          seasonBtnState();
        });
      });
      seasonBtnState();

      // every hen lays an egg when clicked
      var counter = document.getElementById('egg-count');
      function eggCount() { return parseInt(localStorage.getItem('eggs') || '0', 10); }
      function showCount() {
        var n = eggCount();
        counter.textContent = n > 0 ? 'eggs laid: ' + n : '';
      }
      showCount();
      Array.prototype.forEach.call(document.querySelectorAll('.hen-flock'), function (h) {
        h.addEventListener('click', function () {
          if (root.dataset.theme === 'night') return; // tucked up in the coop
          var pop = h.querySelector('.egg-pop');
          pop.classList.remove('popping');
          void pop.offsetWidth;
          pop.classList.add('popping');
          localStorage.setItem('eggs', String(eggCount() + 1));
          setTimeout(showCount, 1200);
        });
      });
    })();
  </script>
</body>
</html>
